# CatLive source, reusable workflow and IPA all belong to this app repository.
name: CatLive App - APK, AAB e IPA
run-name: CatLive App ${{ github.ref_name }}
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão pública'
        required: true
        default: '2.00'
      build_number:
        description: 'Número da build'
        required: true
        default: '1242'
      upload_to_store:
        description: 'Enviar o IPA ao App Store Connect'
        type: boolean
        default: true
      existing_ios_run:
        description: 'ID de uma execução bem-sucedida para enviar seu IPA já compilado'
        type: string
        default: ''
  push:
    tags: ['catlive-app-v*-build*']
permissions:
  contents: read
concurrency:
  group: catlive-app-release
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.manifest.outputs.version }}
      build_number: ${{ steps.manifest.outputs.build_number }}
      source_ref: ${{ steps.manifest.outputs.source_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          if os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch':
              event = json.load(open(os.environ['GITHUB_EVENT_PATH']))['inputs']
              version, build = event['version'], event['build_number']
              assert re.fullmatch(r'[0-9]+\.[0-9]{2}', version) and re.fullmatch(r'[1-9][0-9]*', build)
              with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
                  out.write(f'version={version}\nbuild_number={build}\nsource_ref={os.environ["GITHUB_SHA"]}\n')
              raise SystemExit(0)
          data = json.load(open('.github/catlive-app-release.json'))
          version, build, source = (str(data[k]) for k in ('version', 'build_number', 'source_ref'))
          assert re.fullmatch(r'[0-9]+\.[0-9]{2}', version), 'Invalid version'
          assert re.fullmatch(r'[1-9][0-9]*', build), 'Invalid build'
          assert re.fullmatch(r'[0-9a-f]{40}', source), 'Invalid source commit'
          assert source == subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip(), 'Source must be the local parent commit'
          assert os.environ['RELEASE_TAG'] == f'catlive-app-v{version}-build{build}', 'Tag/manifest mismatch'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'version={version}\nbuild_number={build}\nsource_ref={source}\n')
          PY
  ios:
    needs: prepare
    if: inputs.existing_ios_run == ''
    uses: ./.github/workflows/catlive-ios-appstore.yml
    with:
      upload_to_store: ${{ github.event_name == 'push' || inputs.upload_to_store }}
      version: ${{ needs.prepare.outputs.version }}
      build_number: ${{ needs.prepare.outputs.build_number }}
      source_ref: ${{ needs.prepare.outputs.source_ref }}
    secrets:
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      IOS_CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
      IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
      IOS_PROVISION_PROFILE_BASE64: ${{ secrets.CATLIVE_IOS_PROVISION_PROFILE_BASE64 }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.CATLIVE_APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.CATLIVE_APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.CATLIVE_APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
  android:
    needs: prepare
    if: inputs.existing_ios_run == ''
    uses: ./.github/workflows/catlive-android-release.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      build_number: ${{ needs.prepare.outputs.build_number }}
      source_ref: ${{ needs.prepare.outputs.source_ref }}
    secrets:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
  upload-existing-ios:
    if: github.event_name == 'workflow_dispatch' && inputs.existing_ios_run != ''
    needs: prepare
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      actions: read
    steps:
      - name: Conferir a execução de origem
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.existing_ios_run }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" |
            jq -e '.conclusion == "success" and .path == ".github/workflows/catlive-app-release.yml"'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.existing_ios_run }}
          name: CatLive-iOS-${{ needs.prepare.outputs.version }}
          path: ${{ runner.temp }}/catlive-ipa
      - name: Validar e enviar o IPA existente ao App Store Connect
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
          ASC_KEY_ID: ${{ secrets.CATLIVE_APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.CATLIVE_APP_STORE_CONNECT_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.CATLIVE_APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib, plistlib, re, subprocess, tempfile, zipfile

          ipa, = pathlib.Path(os.environ['RUNNER_TEMP'], 'catlive-ipa').glob('*.ipa')
          with zipfile.ZipFile(ipa) as archive:
              info = plistlib.loads(archive.read('Payload/CatLive.app/Info.plist'))
          assert info['CFBundleIdentifier'] == 'com.hookdeveloper.jaraslive'
          assert info['CFBundleShortVersionString'] == os.environ['VERSION']
          assert info['CFBundleVersion'] == os.environ['BUILD_NUMBER']
          key_id = os.environ['ASC_KEY_ID']
          assert re.fullmatch(r'[A-Z0-9]+', key_id)
          issuer = os.environ['ASC_ISSUER_ID']
          assert issuer
          arguments = ['--file', str(ipa), '--type', 'ios', '--apiKey', key_id, '--apiIssuer', issuer]
          with tempfile.TemporaryDirectory(prefix='catlive-asc-') as directory:
              keys = pathlib.Path(directory, 'private_keys')
              keys.mkdir(mode=0o700)
              key = keys / f'AuthKey_{key_id}.p8'
              key.touch(mode=0o600)
              key.write_bytes(base64.b64decode(os.environ['ASC_API_KEY_P8_BASE64']))
              for action in ('--validate-app', '--upload-app'):
                  subprocess.run(['xcrun', 'altool', action, *arguments], cwd=directory, check=True)
          PY
  release:
    if: github.event_name == 'push'
    needs: [prepare, ios, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CatLive-iOS-${{ needs.prepare.outputs.version }}
          path: ipa
      - uses: actions/download-artifact@v4
        with:
          name: CatLive-Android-${{ needs.prepare.outputs.version }}
          path: android
      - name: Preparar somente IPA, APK e AAB
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = list(Path('ipa').rglob('*.ipa'))
          assert len(files) == 1, 'Expected exactly one IPA'
          Path('release').mkdir()
          files[0].rename('release/CatLive.ipa')
          for extension in ('apk', 'aab'):
              files = list(Path('android').rglob('*.' + extension))
              assert len(files) == 1, 'Expected exactly one ' + extension
              files[0].rename('release/CatLive.' + extension)
          assert {file.name for file in Path('release').iterdir()} == {'CatLive.ipa', 'CatLive.apk', 'CatLive.aab'}
          PY
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: CatLive App ${{ needs.prepare.outputs.version }} - Build ${{ needs.prepare.outputs.build_number }}
          make_latest: false
          fail_on_unmatched_files: true
          body: |
            CatLive para iPad, iPhone e Android.
            Versão ${{ needs.prepare.outputs.version }}, build ${{ needs.prepare.outputs.build_number }}.
            Código: ${{ github.repository }}@${{ needs.prepare.outputs.source_ref }}
            IPA enviado ao App Store Connect para processamento no TestFlight.
          files: |
            release/CatLive.ipa
            release/CatLive.apk
            release/CatLive.aab
