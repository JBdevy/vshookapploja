name: CatLive iOS - signed test package
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão pública'
        required: true
        default: '2.00'
      build_number:
        description: 'Número da build'
        required: true
        default: '1242'
permissions:
  contents: read
jobs:
  ios:
    uses: ./.github/workflows/catlive-ios-appstore.yml
    with:
      upload_to_store: false
      version: ${{ inputs.version }}
      build_number: ${{ inputs.build_number }}
      source_ref: ${{ github.sha }}
    secrets:
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      IOS_CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
      IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
      IOS_PROVISION_PROFILE_BASE64: ${{ secrets.CATLIVE_IOS_PROVISION_PROFILE_BASE64 }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.CATLIVE_APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.CATLIVE_APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.CATLIVE_APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
