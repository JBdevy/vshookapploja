name: Bronze Keys - APK, AAB e IPA

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Versao, exemplo: 1.0.0"
        required: true
        default: "1.0.0"
      build_number:
        description: "Build inteiro e unico para Android e iOS"
        required: true
        default: "1"
  push:
    tags:
      - "hook-keys-v*"

permissions:
  contents: write

concurrency:
  group: hook-keys-release-${{ github.ref }}
  cancel-in-progress: false

env:
  HOOK_KEYS_ANDROID_ID: com.hookdeveloper.hookkeys
  HOOK_KEYS_IOS_ID: com.hookdeveloper.hookkeys

jobs:
  metadata:
    name: Validar versao do Bronze Keys
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      build_number: ${{ steps.version.outputs.build_number }}
      tag_name: ${{ steps.version.outputs.tag_name }}
      release_name: ${{ steps.version.outputs.release_name }}
    steps:
      - id: version
        name: Definir versao e build
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version_name }}
          INPUT_BUILD: ${{ inputs.build_number }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION_NAME="$INPUT_VERSION"
            BUILD_NUMBER="$INPUT_BUILD"
            TAG_NAME="hook-keys-v${VERSION_NAME}-build${BUILD_NUMBER}"
          else
            TAG_NAME="$GITHUB_REF_NAME"
            if [[ ! "$TAG_NAME" =~ ^hook-keys-v([0-9]+\.[0-9]+\.[0-9]+)-build([1-9][0-9]*)$ ]]; then
              echo "Tag invalida. Use hook-keys-v1.0.0-build1."
              exit 1
            fi
            VERSION_NAME="${BASH_REMATCH[1]}"
            BUILD_NUMBER="${BASH_REMATCH[2]}"
          fi

          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Versao invalida: $VERSION_NAME"
            exit 1
          }
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
            echo "Build invalido: $BUILD_NUMBER"
            exit 1
          }

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          # O titulo do Release passa a ser a mensagem do commit que a tag
          # aponta, ou seja a que voce digita no .bat. Se nao houver mensagem
          # (disparo manual pelo Actions) volta para o nome padrao.
          RELEASE_NAME="$(printf '%s' "${COMMIT_MESSAGE:-}" | head -n 1)"
          if [ -z "$RELEASE_NAME" ]; then
            RELEASE_NAME="Bronze Keys $VERSION_NAME - Build $BUILD_NUMBER"
          fi
          echo "release_name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"

  android:
    name: Gerar APK e AAB do Bronze Keys
    needs: metadata
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Hook Keys
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Hook Keys/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"

      - name: Preparar Android SDK, NDK e CMake
        uses: android-actions/setup-android@v3
        with:
          # O padrão da action ainda pede o pacote "tools", que não existe mais no
          # cmdline-tools atual e derruba o passo. SDK, NDK e CMake vêm no passo seguinte.
          packages: platform-tools

      - name: Instalar ferramentas nativas Android
        shell: bash
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' \
            'ndk;27.2.12479018' 'cmake;3.22.1'

      - name: Instalar dependencias e compilar interface
        run: |
          npm ci
          npm run test:release
          npm run build
          npx cap sync android
          node scripts/set-native-version.mjs \
            --platform android \
            --version-name '${{ needs.metadata.outputs.version_name }}' \
            --build-number '${{ needs.metadata.outputs.build_number }}'

      - name: Preparar assinatura Android
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for secret_name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!secret_name:-}" ]; then
              echo "Secret obrigatorio ausente: $secret_name"
              exit 1
            fi
          done

          ORIGINAL_KEYSTORE="$RUNNER_TEMP/hook-keys-original.keystore"
          FINAL_KEYSTORE="$RUNNER_TEMP/hook-keys-upload.p12"
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n\t ' | base64 --decode > "$ORIGINAL_KEYSTORE"
          test -s "$ORIGINAL_KEYSTORE"

          DETECTED_TYPE=''
          for store_type in JKS PKCS12; do
            if keytool -list -keystore "$ORIGINAL_KEYSTORE" \
                -storetype "$store_type" -storepass "$KEYSTORE_PASSWORD" \
                -alias "$KEY_ALIAS" >/dev/null 2>&1; then
              DETECTED_TYPE="$store_type"
              break
            fi
          done
          if [ -z "$DETECTED_TYPE" ]; then
            echo 'Nao foi possivel abrir a keystore com a senha e o alias configurados.'
            exit 1
          fi

          import_key() {
            local source_key_password="$1"
            rm -f "$FINAL_KEYSTORE"
            keytool -importkeystore -noprompt \
              -srckeystore "$ORIGINAL_KEYSTORE" \
              -srcstoretype "$DETECTED_TYPE" \
              -srcstorepass "$KEYSTORE_PASSWORD" \
              -srcalias "$KEY_ALIAS" \
              -srckeypass "$source_key_password" \
              -destkeystore "$FINAL_KEYSTORE" \
              -deststoretype PKCS12 \
              -deststorepass "$KEYSTORE_PASSWORD" \
              -destkeypass "$KEYSTORE_PASSWORD" \
              -destalias "$KEY_ALIAS" >/dev/null 2>&1
          }

          if import_key "$KEY_PASSWORD"; then
            true
          elif [ "$KEY_PASSWORD" != "$KEYSTORE_PASSWORD" ] && \
               import_key "$KEYSTORE_PASSWORD"; then
            true
          else
            echo 'KEY_PASSWORD nao abre a chave do alias informado.'
            exit 1
          fi

          echo "HOOK_KEYS_STORE_FILE=$FINAL_KEYSTORE" >> "$GITHUB_ENV"
          {
            echo 'HOOK_KEYS_KEY_PASSWORD<<EOF'
            echo "$KEYSTORE_PASSWORD"
            echo 'EOF'
          } >> "$GITHUB_ENV"

      - name: Compilar APK e AAB assinados
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon assembleRelease bundleRelease \
            -Pandroid.injected.signing.store.file="$HOOK_KEYS_STORE_FILE" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$HOOK_KEYS_KEY_PASSWORD" \
            -Pandroid.injected.signing.store.type=pkcs12

      - name: Conferir e separar arquivos Android
        shell: bash
        run: |
          set -euo pipefail
          APK='android/app/build/outputs/apk/release/app-release.apk'
          AAB='android/app/build/outputs/bundle/release/app-release.aab'
          test -s "$APK"
          test -s "$AAB"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose "$APK"
          jarsigner -verify "$AAB" >/dev/null
          mkdir -p build/release
          cp "$APK" 'build/release/Bronze Keys.apk'
          cp "$AAB" 'build/release/Bronze Keys.aab'

      - uses: actions/upload-artifact@v4
        with:
          name: Bronze-Keys-Android
          if-no-files-found: error
          path: |
            Hook Keys/build/release/Bronze Keys.apk
            Hook Keys/build/release/Bronze Keys.aab

  ios:
    name: Gerar IPA do Bronze Keys
    needs: metadata
    runs-on: macos-26
    defaults:
      run:
        working-directory: Hook Keys
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Hook Keys/package-lock.json

      - name: Instalar dependencias e compilar interface
        run: |
          npm ci
          npm run test:release
          npm run native:sync:ios
          node scripts/set-native-version.mjs \
            --platform ios \
            --version-name '${{ needs.metadata.outputs.version_name }}' \
            --build-number '${{ needs.metadata.outputs.build_number }}'

      - name: Restaurar Skia Apple compilado
        id: skia-cache
        uses: actions/cache@v4
        with:
          path: |
            Hook Keys/ios/App/Vendor/Skia.xcframework
            Hook Keys/ios/Skia.generated.xcconfig
          key: skia-apple-${{ runner.os }}-${{ hashFiles('Hook Keys/scripts/skia-apple.revision') }}

      - name: Compilar Skia para iPadOS, simulador e macOS
        if: steps.skia-cache.outputs.cache-hit != 'true'
        shell: bash
        run: bash scripts/build-skia-apple.sh

      - name: Conferir integração obrigatória do Skia
        shell: bash
        run: |
          set -euo pipefail
          test -s ios/Skia.generated.xcconfig
          test -d ios/App/Vendor/Skia.xcframework
          grep -q 'BRONZE_KEYS_REQUIRE_SKIA=1' ios/Skia.generated.xcconfig

      - name: Importar certificado iOS
        shell: bash
        env:
          IOS_CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$IOS_CERT_P12_BASE64" ] || [ -z "$IOS_CERT_PASSWORD" ]; then
            echo 'Faltam IOS_CERT_P12_BASE64 ou IOS_CERT_PASSWORD.'
            exit 1
          fi
          CERT_PATH="$RUNNER_TEMP/hook-keys-distribution.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/hook-keys-signing.keychain-db"
          printf '%s' "$IOS_CERT_P12_BASE64" | tr -d '\r\n\t ' | base64 --decode > "$CERT_PATH"
          test -s "$CERT_PATH"
          security create-keychain -p 'hook-keys-ci' "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p 'hook-keys-ci' "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k 'hook-keys-ci' "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Instalar provisioning profile do Bronze Keys
        shell: bash
        env:
          HOOK_KEYS_IOS_PROVISION_PROFILE_BASE64: ${{ secrets.HOOK_KEYS_IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$HOOK_KEYS_IOS_PROVISION_PROFILE_BASE64" ]; then
            echo 'Falta o secret HOOK_KEYS_IOS_PROVISION_PROFILE_BASE64.'
            exit 1
          fi
          PROFILE_PATH="$RUNNER_TEMP/hook-keys.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/hook-keys-profile.plist"
          printf '%s' "$HOOK_KEYS_IOS_PROVISION_PROFILE_BASE64" | tr -d '\r\n\t ' | base64 --decode > "$PROFILE_PATH"
          test -s "$PROFILE_PATH"
          /usr/bin/security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST")
          case "$PROFILE_APP_ID" in
            *.$HOOK_KEYS_IOS_ID) ;;
            *)
              echo "O profile pertence a $PROFILE_APP_ID, nao a $HOOK_KEYS_IOS_ID."
              exit 1
              ;;
          esac
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "HOOK_KEYS_PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "Provisioning profile instalado: $PROFILE_NAME ($PROFILE_UUID)"

      - name: Arquivar Bronze Keys para iOS
        shell: bash
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "$IOS_TEAM_ID" ]; then
            echo 'Falta IOS_TEAM_ID.'
            exit 1
          fi
          xcodebuild -resolvePackageDependencies \
            -project ios/App/App.xcodeproj \
            -scheme App
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/Bronze-Keys.xcarchive" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            PROVISIONING_PROFILE_SPECIFIER="$HOOK_KEYS_PROFILE_NAME" \
            PRODUCT_BUNDLE_IDENTIFIER="$HOOK_KEYS_IOS_ID" \
            archive

      - name: Gerar IPA assinado
        shell: bash
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/HookKeysExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>$IOS_TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$HOOK_KEYS_IOS_ID</key>
              <string>$HOOK_KEYS_PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$PWD/build/Bronze-Keys.xcarchive" \
            -exportPath "$PWD/build/export" \
            -exportOptionsPlist "$RUNNER_TEMP/HookKeysExportOptions.plist"
          IPA_PATH="$(find build/export -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          test -n "$IPA_PATH"
          mkdir -p build/release
          cp "$IPA_PATH" 'build/release/Bronze Keys.ipa'

      - name: Preparar chave da App Store Connect
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          for secret_name in ASC_KEY_ID ASC_ISSUER_ID ASC_API_KEY_P8_BASE64; do
            if [ -z "${!secret_name:-}" ]; then
              echo "Secret obrigatorio ausente: $secret_name"
              exit 1
            fi
          done
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          mkdir -p "$KEY_DIR"
          printf '%s' "$ASC_API_KEY_P8_BASE64" | tr -d '\r\n\t ' | base64 --decode > "$KEY_PATH"
          test -s "$KEY_PATH"
          chmod 600 "$KEY_PATH"

      - name: Validar IPA na App Store Connect
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA_PATH="$(find build/release -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          test -n "$IPA_PATH"
          xcrun altool \
            --validate-app \
            --file "$IPA_PATH" \
            --type ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Enviar Bronze Keys para a App Store Connect
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA_PATH="$(find build/release -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          test -n "$IPA_PATH"
          xcrun altool \
            --upload-app \
            --file "$IPA_PATH" \
            --type ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"
          echo 'IPA do Bronze Keys enviado. Aguarde o processamento na App Store Connect.'

      - uses: actions/upload-artifact@v4
        with:
          name: Bronze-Keys-iOS
          if-no-files-found: error
          path: Hook Keys/build/release/Bronze Keys.ipa

  release:
    name: Publicar somente APK, AAB e IPA
    needs:
      - metadata
      - android
      - ios
    runs-on: ubuntu-latest
    steps:
      - name: Baixar os tres arquivos
        uses: actions/download-artifact@v4
        with:
          pattern: Bronze-Keys-*
          merge-multiple: true
          path: release-assets

      - name: Validar conteudo do Release
        shell: bash
        run: |
          set -euo pipefail
          test -s 'release-assets/Bronze Keys.apk'
          test -s 'release-assets/Bronze Keys.aab'
          test -s 'release-assets/Bronze Keys.ipa'
          FILE_COUNT="$(find release-assets -type f | wc -l | tr -d ' ')"
          if [ "$FILE_COUNT" != '3' ]; then
            echo "O Release deveria conter 3 arquivos, mas recebeu $FILE_COUNT."
            find release-assets -type f -print
            exit 1
          fi

      - name: Publicar Release do Bronze Keys
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.metadata.outputs.tag_name }}
          name: ${{ needs.metadata.outputs.release_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/Bronze Keys.apk
            release-assets/Bronze Keys.aab
            release-assets/Bronze Keys.ipa
