name: CatLive iOS - App Store Connect

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      build_number:
        required: false
        type: string
        default: ''
      source_ref:
        description: 'Commit exato do CatLive neste repositório'
        required: true
        type: string
    secrets:
      IOS_TEAM_ID:
        required: true
      IOS_CERT_P12_BASE64:
        required: true
      IOS_CERT_PASSWORD:
        required: true
      IOS_PROVISION_PROFILE_BASE64:
        required: true
      APP_STORE_CONNECT_KEY_ID:
        required: true
      APP_STORE_CONNECT_ISSUER_ID:
        required: true
      APP_STORE_CONNECT_API_KEY_P8_BASE64:
        required: true

permissions:
  contents: read

concurrency:
  group: catlive-appstore
  cancel-in-progress: false

jobs:
  ios-ipa:
    runs-on: macos-26
    timeout-minutes: 120
    env:
      VERSION: ${{ inputs.version }}
      REQUESTED_BUILD: ${{ inputs.build_number }}
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 2
          persist-credentials: false

      - name: Conferir versão e credenciais
        env:
          IOS_CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^([0-9]+)\.([0-9]{2})$ ]] || { echo 'Use X.XX, por exemplo 1.01'; exit 1; }
          # Preserve the public X.XX string, including its leading zero.
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          BUILD_NUMBER="${REQUESTED_BUILD:-$((1000 + GITHUB_RUN_NUMBER))}"
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo 'Build deve ser um inteiro positivo'; exit 1; }
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          for name in IOS_TEAM_ID IOS_CERT_P12_BASE64 IOS_CERT_PASSWORD IOS_PROVISION_PROFILE_BASE64 APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_API_KEY_P8_BASE64; do
            [[ -n "${!name}" ]] || { echo "Secret ausente: $name"; exit 1; }
          done

      - name: Testar modelo de projetos e importação
        run: |
          swift test --package-path JarasLive --jobs 2
          bash JarasLive/scripts/test-ipad-transport-layout.sh
          bash JarasLive/scripts/test-ipad-standalone-viewport.sh
          bash JarasLive/scripts/test-ipad-input-catalog.sh
          bash JarasLive/scripts/test-ipad-output-channels.sh
          bash JarasLive/scripts/test-ipad-route-recovery.sh
          bash JarasLive/scripts/test-native-project-tabs.sh
          bash JarasLive/scripts/test-native-picker-handoff.sh
          bash JarasLive/scripts/test-control-mappings.sh
          bash JarasLive/scripts/test-remote-midi-actions.sh
          bash JarasLive/scripts/test-ipad-setlist-blocks.sh
          bash JarasLive/scripts/test-empty-track-mixer-selection.sh
          bash JarasLive/scripts/test-daw-remote.sh

      - name: Verificar alterações no motor de áudio
        id: audio-changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, json, os, re, subprocess, urllib.parse
          def api(path, *options):
              return json.loads(subprocess.check_output(['gh', 'api', path, *options], text=True))
          changed = True
          try:
              repo = os.environ['GITHUB_REPOSITORY']
              pages = api(f'repos/{repo}/releases?per_page=100', '--paginate', '--slurp')
              previous = []
              for release in (item for page in pages for item in page):
                  match = re.fullmatch(r'catlive-app-v[0-9]+\.[0-9]{2}-build([0-9]+)', release['tag_name'])
                  if match and not release['draft'] and not release['prerelease'] and int(match[1]) < int(os.environ['BUILD_NUMBER']):
                      previous.append((int(match[1]), release['tag_name']))
              if previous:
                  tag = max(previous)[1]
                  manifest = api(f'repos/{repo}/contents/.github/catlive-app-release.json?ref={urllib.parse.quote(tag)}')
                  base = json.loads(base64.b64decode(manifest['content']))['source_ref']
                  assert re.fullmatch(r'[0-9a-f]{40}', base)
                  current = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
                  comparison = api(f'repos/{repo}/compare/{base}...{current}')
                  files = comparison['files']
                  prefixes = ('JarasLive/Apple/Bridge/', 'JarasLive/Core/Audio/', 'JarasLive/Core/Transport/')
                  exact = {'JarasLive/Apple/Shared/StemAudioPlayback.swift', 'JarasLive/Apple/Shared/AudioDeviceSettings.swift',
                      'JarasLive/Apple/Shared/NativeEffectsChain.swift', 'JarasLive/Application/Project/AudioFileRead.swift',
                      'JarasLive/Application/Project/NativeFXSettings.swift', 'JarasLive/Apple/Shared/EQRealTimeAnalysis.swift',
                      'JarasLive/Tests/Apple/AudioMediaPreparationTests.swift', 'JarasLive/Tests/Apple/EQIntelStabilityTests.swift',
                      'JarasLive/Tests/Apple/DynamicsStabilityTests.swift', 'JarasLive/Tests/Apple/PlaybackMediaIsolationTests.swift',
                      'JarasLive/Tests/Apple/MobilePreparedSyncTests.swift', 'JarasLive/Tests/Apple/MobileQueueSyncTests.swift',
                      'JarasLive/Tests/Apple/MobileRenderClockTests.cpp', 'JarasLive/scripts/test-mobile-queue-sync.sh'}
                  paths = [f[key] for f in files for key in ('filename', 'previous_filename') if key in f]
                  # GitHub caps comparison files at 300. Missing/ambiguous history
                  # must run the tests, including retries after a failed release.
                  changed = len(files) >= 300 or comparison['status'] not in ('ahead', 'identical') or any(p.startswith(prefixes) or p in exact for p in paths)
                  print(f'Audio comparison baseline: {tag}')
          except Exception as error:
              print(f'::warning::Audio baseline unavailable; running synchronization tests ({type(error).__name__}).')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'changed={str(changed).lower()}\n')
          PY

      - name: Testar sincronização do áudio quando alterada
        if: steps.audio-changes.outputs.changed == 'true'
        run: |
          export JARAS_TEST_SF2="$RUNNER_TEMP/catlive-native-test.sf2"
          python3 JarasLive/scripts/generate-test-sf2.py "$JARAS_TEST_SF2"
          bash JarasLive/scripts/test-mobile-queue-sync.sh
          bash JarasLive/scripts/test-prepared-clip-audio.sh
          bash JarasLive/scripts/test-audio.sh Tests/Apple/AudioMediaPreparationTests.swift Tests/Apple/AutomationAudioTests.swift Tests/Apple/EQIntelStabilityTests.swift Tests/Apple/DynamicsStabilityTests.swift Tests/Apple/ItemGainOrderTests.swift Tests/Apple/ItemFXContinuityTests.swift Tests/Apple/RecordingItemSilenceTests.swift
          CATLIVE_EXPORT_TEST_SOURCE=Tests/Apple/ItemPluginRenderTests.swift bash JarasLive/scripts/test-offline-plugin-latency.sh
          bash JarasLive/scripts/test-effects.sh
          bash JarasLive/scripts/test-fx-refresh-during-editing.sh
          bash JarasLive/scripts/test-track-height-layout.sh
          bash JarasLive/scripts/test-instruments.sh
          bash JarasLive/scripts/test-instrument-behavior.sh
          CATLIVE_EXPORT_TEST_SOURCE=Tests/Apple/PlaybackMediaIsolationTests.swift bash JarasLive/scripts/test-offline-export.sh
          bash JarasLive/scripts/test-metronome.sh
          bash JarasLive/scripts/test-midi-sequence.sh

      - name: Preparar assinatura e chave de envio
        env:
          IOS_CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          KEYCHAIN="$RUNNER_TEMP/catlive-ios-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          printf '%s' "$IOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/catlive-ios.p12"
          printf '%s' "$IOS_PROVISION_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/catlive.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/catlive.mobileprovision" > "$RUNNER_TEMP/catlive-profile.plist"
          python3 - <<'PY'
          import datetime, os, pathlib, plistlib
          profile = plistlib.loads(pathlib.Path(os.environ['RUNNER_TEMP'], 'catlive-profile.plist').read_bytes())
          entitlements = profile['Entitlements']
          team = os.environ['IOS_TEAM_ID']
          assert team in profile['TeamIdentifier'], 'Profile de outra equipe Apple'
          prefix = profile['ApplicationIdentifierPrefix'][0]
          assert entitlements['application-identifier'] == prefix + '.com.hookdeveloper.jaraslive', 'Profile deve ser do CatLive iOS'
          assert not entitlements.get('get-task-allow'), 'Use um profile App Store, não Development'
          assert not profile.get('ProvisionedDevices') and not profile.get('ProvisionsAllDevices'), 'Use um profile App Store'
          assert profile['ExpirationDate'] > datetime.datetime.now(datetime.timezone.utc).replace(tzinfo=None), 'Profile expirado'
          assert 'iOS' in profile['Platform'], 'Profile deve ser iOS'
          profile_uuid = profile['UUID']
          import uuid
          assert str(uuid.UUID(profile_uuid)).upper() == profile_uuid.upper(), 'UUID inválido'
          profiles = pathlib.Path.home() / 'Library/MobileDevice/Provisioning Profiles'
          profiles.mkdir(parents=True, exist_ok=True)
          (profiles / (profile_uuid + '.mobileprovision')).write_bytes(pathlib.Path(os.environ['RUNNER_TEMP'], 'catlive.mobileprovision').read_bytes())
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('PROFILE_UUID=' + profile_uuid + '\n')
          PY
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/catlive-ios.p12" -k "$KEYCHAIN" -P "$IOS_CERT_PASSWORD" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          [[ "$ASC_KEY_ID" =~ ^[A-Z0-9]+$ ]] || exit 1
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$ASC_API_KEY_P8_BASE64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Arquivar CatLive para iPad e iPhone
        run: |
          set -euo pipefail
          xcodebuild \
            -project JarasLive/CatLive.xcodeproj \
            -scheme 'CatLive iPadOS' \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/CatLive.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/catlive-ios-build" \
            -jobs 2 \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            archive
          APP="$RUNNER_TEMP/CatLive.xcarchive/Products/Applications/CatLive.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = 'com.hookdeveloper.jaraslive'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")" = "$VERSION"
          codesign --verify --deep --strict "$APP"

      - name: Exportar IPA
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, plistlib
          options = {'method': 'app-store-connect', 'signingStyle': 'manual',
                     'teamID': os.environ['IOS_TEAM_ID'], 'manageAppVersionAndBuildNumber': False,
                     'provisioningProfiles': {'com.hookdeveloper.jaraslive': os.environ['PROFILE_UUID']}}
          pathlib.Path(os.environ['RUNNER_TEMP'], 'catlive-export.plist').write_bytes(plistlib.dumps(options))
          PY
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/CatLive.xcarchive" \
            -exportPath "$RUNNER_TEMP/catlive-export" \
            -exportOptionsPlist "$RUNNER_TEMP/catlive-export.plist"

      - uses: actions/upload-artifact@v4
        with:
          name: CatLive-iOS-${{ inputs.version }}
          path: ${{ runner.temp }}/catlive-export/*.ipa
          if-no-files-found: error

      - name: Validar e enviar ao App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=("$RUNNER_TEMP/catlive-export/"*.ipa)
          [[ ${#packages[@]} -eq 1 ]] || { echo 'Esperado exatamente um IPA'; exit 1; }
          xcrun altool --validate-app --file "${packages[0]}" --type ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          xcrun altool --upload-app --file "${packages[0]}" --type ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          echo 'Enviado para processamento no App Store Connect. A publicação na loja é feita separadamente.'

      - name: Limpar credenciais temporárias
        if: always()
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          security delete-keychain "$RUNNER_TEMP/catlive-ios-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/catlive-ios.p12" "$RUNNER_TEMP/catlive.mobileprovision" "$RUNNER_TEMP/catlive-profile.plist"
          if [[ "${PROFILE_UUID:-}" =~ ^[A-Fa-f0-9-]+$ ]]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          fi
          if [[ "$ASC_KEY_ID" =~ ^[A-Z0-9]+$ ]]; then
            rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          fi
