name: CatLive Android - APK e AAB

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão X.XX'
        required: true
        type: string
      build_number:
        description: 'Número da build Android'
        required: true
        type: string
      source_ref:
        description: 'Commit exato do código'
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      build_number:
        required: true
        type: string
      source_ref:
        description: Commit exato do CatLive neste repositório
        required: true
        type: string
    secrets:
      KEYSTORE_BASE64:
        required: true
      KEYSTORE_PASSWORD:
        required: true
      KEY_ALIAS:
        required: true
      KEY_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_VERSION: ${{ inputs.version }}
      BUILD_NUMBER: ${{ inputs.build_number }}
    defaults:
      run:
        shell: bash
        working-directory: JarasLive/AndroidRemote
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Preparar SDK e conferir versão
        run: |
          set -euo pipefail
          [[ "$APP_VERSION" =~ ^[0-9]+\.[0-9]{2}$ ]] || { echo 'Versão inválida: use X.XX'; exit 1; }
          python3 - <<'PY'
          import os, re
          build = os.environ['BUILD_NUMBER']
          assert re.fullmatch(r'[1-9][0-9]*', build) and int(build) <= 2100000000, 'Build Android inválido'
          PY
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          chmod +x gradlew

      - name: Testar Android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug

      - name: Preparar assinatura com a keystore do VS Hook
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [[ -n "${!name}" ]] || { echo "Secret ausente: $name"; exit 1; }
          done
          ORIGINAL_KEYSTORE="$RUNNER_TEMP/catlive-upload-original.keystore"
          FINAL_KEYSTORE="$RUNNER_TEMP/catlive-upload.p12"
          python3 - <<'PY'
          import base64, os, pathlib
          raw = ''.join(os.environ['KEYSTORE_BASE64'].split())
          data = base64.b64decode(raw + '=' * (-len(raw) % 4), validate=True)
          assert data, 'Keystore vazia'
          pathlib.Path(os.environ['RUNNER_TEMP'], 'catlive-upload-original.keystore').write_bytes(data)
          PY
          DETECTED_TYPE=''
          for type in JKS PKCS12; do
            if keytool -list -keystore "$ORIGINAL_KEYSTORE" -storetype "$type" \
                -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" >/dev/null 2>&1; then
              DETECTED_TYPE="$type"
              break
            fi
          done
          [[ -n "$DETECTED_TYPE" ]] || { echo 'Confira KEYSTORE_PASSWORD e KEY_ALIAS.'; exit 1; }
          import_key() {
            local key_password_env="$1"
            rm -f "$FINAL_KEYSTORE"
            keytool -importkeystore -noprompt \
              -srckeystore "$ORIGINAL_KEYSTORE" -srcstoretype "$DETECTED_TYPE" \
              -srcstorepass:env KEYSTORE_PASSWORD -srcalias "$KEY_ALIAS" \
              -srckeypass:env "$key_password_env" \
              -destkeystore "$FINAL_KEYSTORE" -deststoretype PKCS12 \
              -deststorepass:env KEYSTORE_PASSWORD -destkeypass:env KEYSTORE_PASSWORD \
              -destalias "$KEY_ALIAS" >/dev/null 2>&1
          }
          if import_key KEY_PASSWORD; then
            echo 'Keystore preparada.'
          elif [[ "$KEY_PASSWORD" != "$KEYSTORE_PASSWORD" ]] && import_key KEYSTORE_PASSWORD; then
            echo 'Keystore preparada com a senha do arquivo.'
          else
            echo 'Confira KEY_PASSWORD para o alias informado.'
            exit 1
          fi

      - name: Gerar APK e AAB assinados
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon assembleRelease bundleRelease \
            -PcatliveVersionName="$APP_VERSION" -PcatliveVersionCode="$BUILD_NUMBER" \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/catlive-upload.p12" \
            -Pandroid.injected.signing.store.type=pkcs12 \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEYSTORE_PASSWORD"
          APK='app/build/outputs/apk/release/app-release.apk'
          AAB='app/build/outputs/bundle/release/app-release.aab'
          test -s "$APK" && test -s "$AAB"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$APK"
          jarsigner -verify "$AAB"
          # jarsigner also exits successfully for an unsigned archive.
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('app/build/outputs/bundle/release/app-release.aab') as bundle:
              assert any(name.startswith('META-INF/') and name.endswith(('.RSA', '.DSA', '.EC')) for name in bundle.namelist()), 'AAB sem assinatura'
          PY
          mkdir -p build/release
          cp "$APK" build/release/CatLive.apk
          cp "$AAB" build/release/CatLive.aab

      - uses: actions/upload-artifact@v4
        with:
          name: CatLive-Android-${{ inputs.version }}
          path: |
            JarasLive/AndroidRemote/build/release/CatLive.apk
            JarasLive/AndroidRemote/build/release/CatLive.aab
          if-no-files-found: error

      - name: Limpar keystore temporária
        if: always()
        run: rm -f "$RUNNER_TEMP/catlive-upload-original.keystore" "$RUNNER_TEMP/catlive-upload.p12"
