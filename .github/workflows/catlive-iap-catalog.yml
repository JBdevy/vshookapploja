name: CatLive - Check App Store purchase catalog
on:
  workflow_dispatch:
    inputs:
      make_download_free:
        description: 'Set only the CatLive app download to free; preserve Native in-app purchases'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check app download and Native purchase pricing
        env:
          ASC_KEY_ID: ${{ secrets.CATLIVE_APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.CATLIVE_APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.CATLIVE_APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
          MAKE_DOWNLOAD_FREE: ${{ inputs.make_download_free }}
        run: node scripts/catlive-app-store-pricing.mjs
