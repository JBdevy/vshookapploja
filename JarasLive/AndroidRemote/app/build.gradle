plugins { id 'com.android.application' }
android {
    namespace 'com.hookdeveloper.catlive.remote'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'com.hookdeveloper.catlive.remote'
        minSdk 26
        targetSdk 36
        versionCode providers.gradleProperty('catliveVersionCode').orElse('1058').get().toInteger()
        versionName providers.gradleProperty('catliveVersionName').orElse('1.19').get()
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled true; shrinkResources true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' } }
    testOptions { unitTests.includeAndroidResources = true }
    packaging { resources { excludes += ['META-INF/versions/**', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'] } }
}
dependencies {
    implementation 'org.bouncycastle:bcprov-jdk18on:1.86'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.15.1'
    testImplementation 'org.json:json:20240303'
}
