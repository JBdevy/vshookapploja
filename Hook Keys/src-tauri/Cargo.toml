[package]
name = "hook-keys-desktop"
version = "1.0.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
cpal = "0.16"
midir = "0.10"

[profile.release]
lto = true
codegen-units = 1
strip = true

