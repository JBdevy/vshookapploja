[package]
name = "hook-keys-desktop"
version = "1.0.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
cpal = { version = "0.17.3", features = ["audio_thread_priority"] }
midir = "0.11"
base64 = "0.22"
rfd = "0.15"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38.2"
windows = "0.61"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

# O teste local usa o callback de áudio real. Otimize o código do aplicativo
# também no Tauri dev para o teste não criar dropouts que não existem no build
# comercial; as dependências continuam no perfil rápido padrão.
[profile.dev.package.hook-keys-desktop]
opt-level = 2
